<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="manifest" href="manifest.json">
  <title>MLBB Fast-Hand Buy & Sell Trainer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #05070a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      touch-action: manipulation;
    }

    /* Compact Floating Top-Center Pill */
    #mini-hud {
      position: fixed;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      padding: 3px 8px;
      gap: 8px;
      border-radius: 999px;
      background: rgba(10, 14, 23, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      display: flex;
      align-items: center;
      transition: opacity 0.2s;
    }

    #mini-hud.dimmed {
      opacity: 0.35;
    }

    #mini-hud:hover {
      opacity: 1;
    }

    .mini-pill {
      background: #f7ba2a;
      color: #000;
      padding: 1px 6px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 11px;
      white-space: nowrap;
    }

    .timer-display {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: 900;
      color: #10b981;
      min-width: 58px;
      text-align: right;
    }

    .timer-display.running {
      color: #f59e0b;
    }

    .icon-btn {
      background: rgba(30, 41, 59, 0.85);
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s ease;
    }

    .icon-btn:hover {
      background: #334155;
      color: #fff;
    }

    /* Collapsible Controls Popover */
    #menu-drawer {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 130;
      display: none;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      max-width: 92vw;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
    }

    #menu-drawer.open {
      display: flex;
    }

    .drawer-step-label {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      padding: 0 6px;
      white-space: nowrap;
    }

    .btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #334155;
      color: #fff;
      border-color: #475569;
    }

    .btn-gold {
      background: #b45309;
      color: #fff;
      border-color: #d97706;
    }

    .btn-gold:hover {
      background: #d97706;
    }

    .mode-toggle {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      display: flex;
      overflow: hidden;
    }

    .mode-btn {
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      background: transparent;
      color: #64748b;
      border: none;
      cursor: pointer;
    }

    .mode-btn.active {
      background: #2563eb;
      color: #fff;
    }

    /* Main Canvas / Simulation Stage */
    main {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05070a;
      position: relative;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #screen-wrapper {
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: inline-block;
    }

    #screen-img {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    /* Interactive Hitbox Targets */
    .hitbox {
      position: absolute;
      cursor: pointer;
      z-index: 10;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Practice Mode Guide Ring */
    .guide-pulse {
      position: absolute;
      border: 3px solid #f7ba2a;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(247, 186, 42, 0.9), inset 0 0 10px rgba(247, 186, 42, 0.5);
      animation: pulse-ring 1.2s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 12;
    }

    .scroll-hint-arrow {
      display: none;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: rgba(10, 14, 23, 0.85);
      border: 2px solid #38d9f9;
      color: #38d9f9;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(56, 217, 249, 0.5);
      animation: swipe-up-anim 1s infinite ease-in-out;
    }

    .guide-pulse.is-scroll .scroll-hint-arrow {
      display: flex;
    }

    @keyframes swipe-up-anim {
      0% { transform: translate(-50%, -25%); opacity: 0.55; }
      50% { transform: translate(-50%, -65%); opacity: 1; }
      100% { transform: translate(-50%, -95%); opacity: 0.3; }
    }

    @keyframes pulse-ring {
      0% { transform: scale(0.96); opacity: 0.7; box-shadow: 0 0 10px #f7ba2a; }
      100% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 25px #f7ba2a, inset 0 0 15px #f7ba2a; }
    }

    .guide-tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      color: #f7ba2a;
      border: 1px solid #f7ba2a;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 15;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    /* Tap feedback ripples */
    .tap-ripple {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 217, 249, 0.8) 0%, rgba(56, 217, 249, 0) 70%);
      transform: translate(-50%, -50%) scale(0.2);
      animation: ripple-grow 0.35s ease-out forwards;
      pointer-events: none;
      z-index: 20;
    }

    @keyframes ripple-grow {
      to { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* Miss feedback */
    .miss-flash {
      position: absolute;
      inset: 0;
      background: rgba(239, 68, 68, 0.25);
      pointer-events: none;
      animation: miss-fade 0.25s ease-out forwards;
      z-index: 30;
    }

    @keyframes miss-fade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Victory / Results Modal */
    #victory-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    #victory-modal.show {
      display: flex;
    }

    .card {
      background: #0f172a;
      border: 2px solid #2563eb;
      border-radius: 12px;
      width: 90%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(37, 99, 235, 0.3);
      text-align: center;
      animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop-in {
      0% {
        transform: scale(0.85);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .rank-badge {
      display: inline-block;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 24px;
      border-radius: 999px;
      margin: 12px 0 6px 0;
    }

    .rank-immortal {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: #fff;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }

    .rank-glory {
      background: linear-gradient(135deg, #f59e0b, #eab308);
      color: #000;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    }

    .rank-mythic {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: #fff;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    .rank-legend {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #fff;
    }

    .rank-epic {
      background: #475569;
      color: #cbd5e1;
    }

    .time-hero {
      font-size: 42px;
      font-weight: 900;
      font-family: "Courier New", Courier, monospace;
      color: #38d9f9;
      margin: 8px 0;
      text-shadow: 0 0 15px rgba(56, 217, 249, 0.5);
    }

    .stats-table {
      width: 100%;
      margin: 16px 0;
      border-collapse: collapse;
      font-size: 11px;
      text-align: left;
    }

    .stats-table th {
      color: #94a3b8;
      border-bottom: 1px solid #1e293b;
      padding: 4px 6px;
    }

    .stats-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #1e293b;
    }

    .stats-table tr.slowest td {
      color: #f87171;
      font-weight: 700;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    /* Bottom Status Banner */
    .status-banner {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Compact Floating Pill -->
  <div id="mini-hud">
    <span class="mini-pill" id="step-number-pill">1/20</span>
    <span class="timer-display" id="hud-timer">0.000s</span>
    <button id="fs-btn" class="icon-btn" title="Fullscreen (F)" onclick="toggleFullscreen()">⛶</button>
    <button class="icon-btn" title="Restart (Space)" onclick="resetDrill()">↻</button>
    <button id="menu-btn" class="icon-btn" title="Settings" onclick="toggleMenu()">⚙</button>
  </div>

  <!-- Collapsible Controls Popover -->
  <div id="menu-drawer">
    <div class="mode-toggle">
      <button id="btn-drill-triple" class="mode-btn active" onclick="setDrill('triple')">❄ Triple (20)</button>
      <button id="btn-drill-double" class="mode-btn" onclick="setDrill('double')">⚡ Immo→Winter (12)</button>
    </div>
    <div class="mode-toggle">
      <button id="btn-mode-practice" class="mode-btn active" onclick="setMode('practice')">🎓 Training</button>
      <button id="btn-mode-ranked" class="mode-btn" onclick="setMode('ranked')">⚡ Ranked</button>
    </div>
    <span class="drawer-step-label" id="step-desc-text">Click Buy Shop</span>
    <button id="hitbox-mode-btn" class="btn" onclick="toggleHitboxMode()">👍 Hitbox: Realistic</button>
    <button id="fs-drawer-btn" class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button id="sound-btn" class="btn" onclick="toggleSound()">🔊 Sound: ON</button>
    <button id="hint-toggle-btn" class="btn" onclick="toggleHints()">💬 Hints: ON</button>
    <button class="btn btn-gold" onclick="resetDrill()">🔄 Restart</button>
  </div>

  <!-- Simulation Stage -->
  <main id="main-stage">
    <div id="game-container">
      <div id="screen-wrapper">
        <img id="screen-img" src="trainer_assets/00_hud_start.jpg" alt="MLBB Game Screen">
        <!-- Interactive Target Hitbox -->
        <div id="active-hitbox" class="hitbox"></div>
        <!-- Practice Guide Ring -->
        <div id="guide-indicator" class="guide-pulse">
          <div id="guide-tip" class="guide-tooltip">1. BUY SHOP</div>
          <div class="scroll-hint-arrow">⬆ SWIPE UP</div>
        </div>
      </div>
    </div>

    <div class="status-banner" id="status-hint">
      👉 Step 1: Tap the Shop / Gold button top right ($29,764) to open the shop!
    </div>
  </main>

  <!-- Victory / Results Dialog -->
  <div id="victory-modal">
    <div class="card">
      <h2 style="font-size: 18px; color: #94a3b8; text-transform: uppercase;">Drill Completed!</h2>
      <div id="res-rank" class="rank-badge rank-glory">Mythical Glory</div>
      <div id="res-time" class="time-hero">2.481s</div>
      <p id="res-comment" style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">Fast fingers! Ready for
        late-game teamfights.</p>

      <div style="max-height: 180px; overflow-y: auto; margin: 10px 0; border: 1px solid #1e293b; border-radius: 6px;">
        <table class="stats-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Action</th>
              <th style="text-align: right;">Split</th>
            </tr>
          </thead>
          <tbody id="split-table-body">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>

      <div class="modal-actions">
        <button class="btn btn-gold" onclick="resetDrill()" style="padding: 8px 20px; font-size: 14px;">⚡ Try Again
          (Space)</button>
        <button class="btn" onclick="closeModal()" style="padding: 8px 16px;">Close</button>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
     * Audio Synthesis (Web Audio API - Zero External Files)
     * ============================================================ */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔊 Sound: ON' : '🔈 Sound: OFF';
    }

    function playTone(freq, type, duration, gainLevel = 0.1) {
      if (!soundEnabled) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainLevel, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    function playClickSound() {
      playTone(1200, 'sine', 0.05, 0.15);
    }

    function playScrollSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(540, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) { }
    }

    function playCoinSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        [1760, 2637].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.setValueAtTime(f, now + i * 0.06);
          gain.gain.setValueAtTime(0.12, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 0.12);
        });
      } catch (e) { }
    }

    function playFreezeSound() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const now = audioCtx.currentTime;
        [800, 1200, 1800, 2400].forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + i * 0.04);
          gain.gain.setValueAtTime(0.2, now + i * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.04 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.04);
          osc.stop(now + i * 0.04 + 0.35);
        });
      } catch (e) { }
    }

    function playErrorBuzz() {
      playTone(180, 'sawtooth', 0.15, 0.18);
    }

    function playVictoryChime() {
      if (!soundEnabled) return;
      initAudio();
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        const now = audioCtx.currentTime;
        notes.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + i * 0.08);
          gain.gain.setValueAtTime(0.15, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.3);
        });
      } catch (e) { }
    }

    /* ============================================================
     * Step Definitions (19-Step Triple Swap from 1000040726.mp4)
     * ============================================================ */
    const BOX_SHOP  = { l: 0.893, t: 0.006, w: 0.067, h: 0.080 };
    const PAD_SHOP  = { l: 0.885, t: 0.000, w: 0.115, h: 0.092 };

    const BOX_BUY   = { l: 0.762, t: 0.858, w: 0.124, h: 0.070 };
    const PAD_BUY   = { l: 0.755, t: 0.842, w: 0.140, h: 0.100 };
    const BOX_X     = { l: 0.846, t: 0.072, w: 0.046, h: 0.068 };
    const PAD_X     = { l: 0.830, t: 0.055, w: 0.075, h: 0.100 };
    const BOX_SLOT1 = { l: 0.217, t: 0.838, w: 0.047, h: 0.100 };
    const PAD_SLOT1 = { l: 0.212, t: 0.820, w: 0.055, h: 0.135 };

    const ALL_STEPS = [
      {
        step: 1,

        img: "trainer_assets/00_hud_start.jpg",

        box: BOX_SELL,

      },

        sound: "coin",
        box: { l: 0.853, t: 0.100, w: 0.050, h: 0.112 },
        padBox: { l: 0.750, t: 0.090, w: 0.160, h: 0.135 },
        tooltip: "4. BUY IMMO"
      },
      {
        step: 5,

        sound: "click",
        box: BOX_SHOP,
        padBox: PAD_SHOP,
        tooltip: "5. OPEN SHOP"
      },
      {
        step: 6,
        title: "Select Immortality (Slot 1)",

      },
      {

        hint: "Swipe UP on the Attack item list (or scroll mouse wheel down) to reveal Rose Gold Meteor!",

        scrollFrames: [
          "trainer_assets/16b_shop_attack_mid1.jpg",
          "trainer_assets/16c_shop_attack_mid2.jpg"
        ],
        sound: "scroll",
        box: { l: 0.205, t: 0.140, w: 0.295, h: 0.660 },
        padBox: { l: 0.190, t: 0.110, w: 0.325, h: 0.710 },
        tooltip: "17. SWIPE UP"
      },
      {

        hint: "Tap Rose Gold Meteor ($1928) in the Attack grid!",
        img: "trainer_assets/16_shop_attack_rosegold.jpg",
        sound: "click",
        box: { l: 0.210, t: 0.405, w: 0.135, h: 0.140 },
        padBox: { l: 0.200, t: 0.395, w: 0.155, h: 0.160 },
        tooltip: "18. ROSE GOLD"
      },
      {
        step: 19,
        title: "Buy Rose Gold Meteor",
        hint: "Tap the gold 'Purchase' button ($1928) at the bottom right!",
        img: "trainer_assets/17_shop_rosegold_sel.jpg",
        sound: "coin",
        box: BOX_BUY,
        padBox: PAD_BUY,
        tooltip: "19. BUY ROSE GOLD"
      },
      {
        step: 20,
        title: "Exit Shop (X)",
        hint: "Rose Gold Meteor equipped! Tap the white 'X' button to finish!",
        img: "trainer_assets/18_shop_rosegold_bought.jpg",
        sound: "click",
        box: BOX_X,
        padBox: PAD_X,
        tooltip: "20. EXIT (X)"
      }
    ];
    const FINAL_IMG_TRIPLE = "trainer_assets/19_hud_rosegold_done.jpg";
    const FINAL_IMG_DOUBLE = "trainer_assets/12_hud_frozen_active.jpg";
    const PRELOADED = [];

    /* ============================================================
     * State & Logic
     * ============================================================ */
    let currentStepIdx = 0;
    let drill = 'triple'; // 'triple' (20) or 'double' (12)
    let mode = 'practice'; // 'practice' or 'ranked'
    let hitboxMode = 'realistic'; // 'realistic' or 'strict'
    let isRunning = false;
    let startTime = 0;
    let stepStartTime = 0;
    let lastTapTime = 0;
    let scrollDrag = null;
    let wheelAccum = 0;
    let splits = [];
    let timerInterval = null;
    let misclicks = 0;
    let hintsVisible = true;

    function getActiveSteps() {
      return drill === 'double' ? ALL_STEPS.slice(0, 12) : ALL_STEPS;
    }

    function getFinalImg() {
      return drill === 'double' ? FINAL_IMG_DOUBLE : FINAL_IMG_TRIPLE;
    }

    const screenImg = document.getElementById('screen-img');
    const screenWrapper = document.getElementById('screen-wrapper');
    const activeHitbox = document.getElementById('active-hitbox');
    const guideIndicator = document.getElementById('guide-indicator');
    const guideTip = document.getElementById('guide-tip');
    const hudTimer = document.getElementById('hud-timer');
    const stepNumberPill = document.getElementById('step-number-pill');
    const stepDescText = document.getElementById('step-desc-text');
    const statusHint = document.getElementById('status-hint');
    const miniHud = document.getElementById('mini-hud');
    const menuDrawer = document.getElementById('menu-drawer');
    const mainStage = document.getElementById('main-stage');

    function toggleMenu() {
      menuDrawer.classList.toggle('open');
    }

    function closeMenu() {
      menuDrawer.classList.remove('open');
    }

    function toggleHints() {
      hintsVisible = !hintsVisible;
      document.getElementById('hint-toggle-btn').innerText = hintsVisible ? '💬 Hints: ON' : '💬 Hints: OFF';
      statusHint.style.display = (mode === 'practice' && hintsVisible && !isRunning) ? 'flex' : 'none';
    }

    function updateFullscreenUI() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      document.getElementById('fs-btn').innerText = isFs ? '⤫' : '⛶';
      document.getElementById('fs-drawer-btn').innerText = isFs ? '✕ Exit Fullscreen' : '⛶ Fullscreen';
    }

    function toggleFullscreen() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFs) {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          Promise.resolve(req.call(el)).then(() => {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(() => {});
            }
          }).catch(() => {});
        }
      } else {
        const ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) {
          Promise.resolve(ex.call(document)).catch(() => {});
        }
      }
    }

    function setDrill(newDrill) {
      drill = newDrill;
      document.getElementById('btn-drill-triple').className = 'mode-btn' + (drill === 'triple' ? ' active' : '');
      document.getElementById('btn-drill-double').className = 'mode-btn' + (drill === 'double' ? ' active' : '');
      resetDrill();
    }

    function toggleHitboxMode() {
      hitboxMode = (hitboxMode === 'realistic') ? 'strict' : 'realistic';
      document.getElementById('hitbox-mode-btn').innerText = hitboxMode === 'realistic' ? '👍 Hitbox: Realistic' : '🎯 Hitbox: Strict';
      applyHitboxPosition();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('btn-mode-practice').className = 'mode-btn' + (mode === 'practice' ? ' active' : '');
      document.getElementById('btn-mode-ranked').className = 'mode-btn' + (mode === 'ranked' ? ' active' : '');
      closeMenu();
      applyHitboxPosition();
      resetDrill();
    }

    function applyHitboxPosition() {
      const steps = getActiveSteps();
      const step = steps[currentStepIdx];
      if (!step) return;

      scrollDrag = null;
      wheelAccum = 0;
      screenImg.src = step.img;
      stepNumberPill.innerText = `${step.step}/${steps.length}`;
      stepDescText.innerText = step.title;
      statusHint.innerText = `👉 Step ${step.step}: ${step.hint}`;
      statusHint.style.display = (mode === 'practice' && hintsVisible && !isRunning) ? 'flex' : 'none';

      const b = step.box;
      const hb = (hitboxMode === 'realistic' && step.padBox) ? step.padBox : step.box;
      activeHitbox.style.left = (hb.l * 100) + '%';
      activeHitbox.style.top = (hb.t * 100) + '%';
      activeHitbox.style.width = (hb.w * 100) + '%';
      activeHitbox.style.height = (hb.h * 100) + '%';
      activeHitbox.style.cursor = step.type === 'scroll' ? 'ns-resize' : 'pointer';

      guideIndicator.classList.toggle('is-scroll', step.type === 'scroll');
      if (mode === 'practice') {
        guideIndicator.style.display = 'block';
        guideIndicator.style.left = (b.l * 100) + '%';
        guideIndicator.style.top = (b.t * 100) + '%';
        guideIndicator.style.width = (b.w * 100) + '%';
        guideIndicator.style.height = (b.h * 100) + '%';
        guideTip.innerText = step.tooltip;

        if (b.t < 0.16) {
          guideTip.style.top = 'calc(100% + 6px)';
          guideTip.style.bottom = 'auto';
        } else {
          guideTip.style.bottom = 'calc(100% + 6px)';
          guideTip.style.top = 'auto';
        }

        const cx = b.l + b.w / 2;
        if (cx > 0.85) {
          guideTip.style.right = '0';
          guideTip.style.left = 'auto';
          guideTip.style.transform = 'none';
        } else if (cx < 0.15) {
          guideTip.style.left = '0';
          guideTip.style.right = 'auto';
          guideTip.style.transform = 'none';
        } else {
          guideTip.style.left = '50%';
          guideTip.style.right = 'auto';
          guideTip.style.transform = 'translateX(-50%)';
        }
      } else {
        guideIndicator.style.display = 'none';
      }
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      startTime = performance.now();
      stepStartTime = startTime;
      hudTimer.classList.add('running');
      miniHud.classList.add('dimmed');
      closeMenu();
      statusHint.style.display = 'none';
      timerInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        hudTimer.innerText = elapsed.toFixed(3) + 's';
      }, 25);
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      hudTimer.classList.remove('running');
      miniHud.classList.remove('dimmed');
      const totalElapsed = (performance.now() - startTime) / 1000;
      hudTimer.innerText = totalElapsed.toFixed(3) + 's';
      return totalElapsed;
    }

    function completeCurrentStep(e) {
      const now = performance.now();
      const steps = getActiveSteps();
      const curStep = steps[currentStepIdx];

      // Record split
      const splitTime = (now - stepStartTime) / 1000;
      splits.push({
        step: curStep.step,
        title: curStep.title,
        duration: splitTime
      });
      stepStartTime = now;

      // Sound effect
      const snd = curStep.sound;
      if (snd === 'coin') playCoinSound();
      else if (snd === 'freeze') playFreezeSound();
      else if (snd === 'scroll') playScrollSound();
      else playClickSound();

      // Spawn visual tap ripple
      createRipple(e);

      // Advance step
      currentStepIdx++;
      if (currentStepIdx < steps.length) {
        applyHitboxPosition();
      } else {
        // Complete!
        screenImg.src = getFinalImg();
        activeHitbox.style.display = 'none';
        guideIndicator.style.display = 'none';
        const total = stopTimer();
        setTimeout(() => showVictory(total), 350);
      }
    }

    function handleValidTap(e) {
      e.stopPropagation();
      closeMenu();
      initAudio();

      const steps = getActiveSteps();
      const curStep = steps[currentStepIdx];
      if (!curStep) return;

      if (curStep.type === 'scroll') {
        if (!isRunning) {
          startTimer();
        }
        scrollDrag = { pointerId: e.pointerId, startY: e.clientY, lastY: e.clientY };
        try { activeHitbox.setPointerCapture(e.pointerId); } catch (_) { }
        return;
      }

      const now = performance.now();
      if (now - lastTapTime < 60) return;
      lastTapTime = now;

      if (!isRunning) {
        startTimer();
      }
      completeCurrentStep(e);
    }

    function releaseScrollCapture(pointerId) {
      try {
        if (activeHitbox.hasPointerCapture(pointerId)) {
          activeHitbox.releasePointerCapture(pointerId);
        }
      } catch (_) { }
    }

    function handleScrollMove(e) {
      if (!scrollDrag || e.pointerId !== scrollDrag.pointerId) return;
      e.preventDefault();
      const steps = getActiveSteps();
      const curStep = steps[currentStepIdx];
      if (!curStep || curStep.type !== 'scroll') return;

      const dy = scrollDrag.startY - e.clientY;
      const threshold = Math.max(45, screenWrapper.clientHeight * 0.14);
      const progress = dy / threshold;

      if (progress >= 1.0) {
        const pid = scrollDrag.pointerId;
        scrollDrag = null;
        releaseScrollCapture(pid);
        completeCurrentStep(e);
      } else if (progress >= 0.65) {
        screenImg.src = curStep.scrollFrames[1];
      } else if (progress >= 0.30) {
        screenImg.src = curStep.scrollFrames[0];
      } else {
        screenImg.src = curStep.img;
      }
    }

    function handleScrollEnd(e) {
      if (!scrollDrag || e.pointerId !== scrollDrag.pointerId) return;
      const steps = getActiveSteps();
      const curStep = steps[currentStepIdx];
      const dy = scrollDrag.startY - e.clientY;
      const threshold = Math.max(45, screenWrapper.clientHeight * 0.14);
      const pid = scrollDrag.pointerId;
      scrollDrag = null;
      releaseScrollCapture(pid);

      if (!curStep || curStep.type !== 'scroll') return;
      if (dy >= threshold * 0.55) {
        completeCurrentStep(e);
      } else {
        screenImg.src = curStep.img;
      }
    }

    function handleScrollWheel(e) {
      const steps = getActiveSteps();
      const curStep = steps[currentStepIdx];
      if (!curStep || curStep.type !== 'scroll') return;

      e.preventDefault();
      e.stopPropagation();
      closeMenu();
      initAudio();
      if (!isRunning) {
        startTimer();
      }
      if (e.deltaY > 0) {
        wheelAccum += e.deltaY;
        if (wheelAccum >= 120) {
          wheelAccum = 0;
          completeCurrentStep(e);
        } else if (wheelAccum >= 75) {
          screenImg.src = curStep.scrollFrames[1];
        } else if (wheelAccum >= 35) {
          screenImg.src = curStep.scrollFrames[0];
        }
      }
    }

    function handleMissTap(e) {
      if (e.target === activeHitbox) return;
      initAudio();
      misclicks++;
      playErrorBuzz();

      // Show red miss flash
      const flash = document.createElement('div');
      flash.className = 'miss-flash';
      screenWrapper.appendChild(flash);
      setTimeout(() => flash.remove(), 250);
    }

    function createRipple(e) {
      const rect = screenWrapper.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      const rip = document.createElement('div');
      rip.className = 'tap-ripple';
      rip.style.left = x + 'px';
      rip.style.top = y + 'px';
      screenWrapper.appendChild(rip);
      setTimeout(() => rip.remove(), 400);
    }

    function resetDrill() {
      clearInterval(timerInterval);
      isRunning = false;
      currentStepIdx = 0;
      lastTapTime = 0;
      scrollDrag = null;
      wheelAccum = 0;
      splits = [];
      misclicks = 0;
      hudTimer.innerText = '0.000s';
      hudTimer.classList.remove('running');
      miniHud.classList.remove('dimmed');
      activeHitbox.style.display = 'block';
      closeMenu();
      closeModal();
      applyHitboxPosition();
    }

    function showVictory(total) {
      playVictoryChime();

      let rankClass = 'rank-epic';
      let rankName = 'Epic / Grandmaster';
      let comment = 'Immortality will expire before you freeze! Keep practicing finger speed.';

      const thresholds = (drill === 'triple')
        ? [4.10, 5.40, 7.00, 9.00]
        : [2.20, 3.00, 4.00, 5.50];

      if (total < thresholds[0]) {
        rankClass = 'rank-immortal';
        rankName = 'Mythical Immortal';
        comment = '🔥 INHUMAN REACTION! Pro MPL player tier fast swap!';
      } else if (total < thresholds[1]) {
        rankClass = 'rank-glory';
        rankName = 'Mythical Glory';
        comment = '⚡ Flawless swap! You can pull this off in high rank teamfights.';
      } else if (total < thresholds[2]) {
        rankClass = 'rank-mythic';
        rankName = 'Mythic';
        comment = '👍 Good speed! With a bit more muscle memory, you will be unstoppable.';
      } else if (total < thresholds[3]) {
        rankClass = 'rank-legend';
        rankName = 'Legend';
        comment = 'Decent, but you might get bursted down before your swap completes.';
      }

      const resRank = document.getElementById('res-rank');
      resRank.className = `rank-badge ${rankClass}`;
      resRank.innerText = rankName;

      document.getElementById('res-time').innerText = total.toFixed(3) + 's';
      document.getElementById('res-comment').innerText = comment;

      // Populate splits table
      const tbody = document.getElementById('split-table-body');
      tbody.innerHTML = '';

      let maxDuration = -1;
      let slowestIdx = -1;
      splits.forEach((s, idx) => {
        if (s.duration > maxDuration) {
          maxDuration = s.duration;
          slowestIdx = idx;
        }
      });

      splits.forEach((s, idx) => {
        const tr = document.createElement('tr');
        if (idx === slowestIdx) tr.className = 'slowest';
        tr.innerHTML = `
          <td>${s.step}</td>
          <td>${s.title} ${idx === slowestIdx ? '<span style="font-size: 10px; color:#f87171;">(Slowest)</span>' : ''}</td>
          <td style="text-align: right; font-family: monospace;">${s.duration.toFixed(3)}s</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('victory-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('victory-modal').classList.remove('show');
    }

    /* Event Listeners */
    activeHitbox.addEventListener('pointerdown', handleValidTap);
    activeHitbox.addEventListener('pointermove', handleScrollMove);
    activeHitbox.addEventListener('pointerup', handleScrollEnd);
    activeHitbox.addEventListener('pointercancel', handleScrollEnd);
    activeHitbox.addEventListener('wheel', handleScrollWheel, { passive: false });
    screenWrapper.addEventListener('pointerdown', handleMissTap);
    miniHud.addEventListener('pointerdown', (e) => e.stopPropagation());
    menuDrawer.addEventListener('pointerdown', (e) => e.stopPropagation());
    mainStage.addEventListener('pointerdown', (e) => {
      if (!menuDrawer.contains(e.target) && !miniHud.contains(e.target)) {
        closeMenu();
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'KeyR') {
        e.preventDefault();
        resetDrill();
      } else if (e.code === 'KeyF') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.code === 'Escape') {
        closeMenu();
        closeModal();
      }
    });

    // Initialize & preload all 23 screens for 0ms tap/scroll swaps
    window.addEventListener('load', () => {
      const allUrls = [];
      ALL_STEPS.forEach(s => {
        allUrls.push(s.img);
        if (s.scrollFrames) allUrls.push(...s.scrollFrames);
      });
      allUrls.push(FINAL_IMG_TRIPLE);
      allUrls.forEach(src => {
        const im = new Image();
        im.src = src;
        PRELOADED.push(im);
      });
      applyHitboxPosition();
    });
  </script>
